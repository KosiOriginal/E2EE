<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TOTTALY NOT ILLEGAL WEBSITE FOR COMMUNICATING</title>
<link rel="icon" href="/favicon.ico" type="favicon" />

<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="layout">

  <div class="sidebar">
    <h1>TOTTALY NOT ILLEGAL WEBSITE FOR PRIVATE COMMUNICATING</h1>

    <div class="panel">
      <div><strong>FINGERPRINT</strong> (share/verify with friends):</div>
      <div class="mono" id="myFingerprint">...</div>
      <div style="margin-top:8px;"><strong>PUBLIC KEY</strong> (share this so friends can add you):</div>
      <div class="mono" id="myPublicKey">...</div>
    </div>

    <div class="panel">
      <div><strong>Add a contact</strong></div>
      <input type="text" id="newContactName" placeholder="Name (e.g. Alex)" />
      <input type="text" id="newContactKey" placeholder="Paste their public key" />
      <button id="addContactBtn">Add contact</button>
    </div>

    <div class="panel">
      <div><strong>Contacts</strong></div>
      <div id="contactList"></div>
    </div>
  </div>

  <div class="main">
    <div id="status">Connecting...</div>

    <div id="chatPanel" class="panel">
      <button id="backBtn">← Contacts</button>
      <div><strong id="activeContactName"></strong></div>
      <div class="mono" id="activeContactFingerprint" style="margin-bottom:8px;"></div>

      <div id="chatLog"></div>
      <div class="row">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <label style="cursor:pointer;">
          📷 Send image
          <input type="file" id="imageInput" accept="image/*" style="display:none;" />
        </label>
        <button id="recordBtn">🎙 Record voice note</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl.min.js"></script>
<script src="crypto/identity_browser.js"></script>
<script src="crypto/ratchet_browser.js"></script>
<script src="crypto/media_browser.js"></script>
<script src="crypto/contacts.js"></script>
<script src="app.js"></script>
</body>
</html>
