<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>secnet — private chat</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 0; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.2rem; color: #7fd; }
  .panel { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .mono { font-family: monospace; word-break: break-all; font-size: 0.85rem; color: #9cf; }
  #status { color: #9f9; font-size: 0.9rem; }
  #chatLog { height: 300px; overflow-y: auto; background: #000; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .msg { margin-bottom: 8px; padding: 6px 8px; border-radius: 6px; max-width: 120%; }
  .msg.me { background: #234; margin-left: auto; text-align: right; }
  .msg.friend { background: #333; margin-right: auto; }
  input[type=text] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #222; color: #eee; box-sizing: border-box; }
  button { padding: 8px 12px; border-radius: 6px; border: none; background: #2a6; color: white; cursor: pointer; margin-top: 6px; }
  button:hover { background: #3b7; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=text] { flex: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>🔒 secnet — private chat</h1>

  <div class="panel">
    <div><strong>Тва е fingerprinta</strong> :</div>
    <div class="mono" id="myFingerprint">...</div>
    <div style="margin-top:8px;"><strong>ТУЙ трябва да го пратиш на некого </strong> :</div>
    <div class="mono" id="myPublicKey">...</div>
  </div>

  <div class="panel">
    <div><strong>Connect to a friend</strong> — paste the public key they shared with you:</div>
    <div class="row">
      <input type="text" id="friendKeyInput" placeholder="Paste friend's public key here" />
      <button id="connectBtn">Connect</button>
    </div>
    <div style="margin-top:8px;">Friend fingerprint: <span class="mono" id="friendFingerprint">(none yet)</span></div>
  </div>

  <div id="status">Connecting...</div>

  <div class="panel">
    <div id="chatLog"></div>
    <div class="row">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button id="sendBtn">Send</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <label style="cursor:pointer;">
        📷 Send image
        <input type="file" id="imageInput" accept="image/*" style="display:none;" />
      </label>
      <button id="recordBtn">🎙 Record voice note</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl.min.js"></script>
<script src="crypto/identity_browser.js"></script>
<script src="crypto/ratchet_browser.js"></script>
<script src="crypto/media_browser.js"></script>
<script src="app.js"></script>
</body>
</html>
